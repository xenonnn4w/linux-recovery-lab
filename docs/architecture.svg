<text x="1337.5" y="691" text-anchor="middle" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#102b52">Restore valid JSON / read permission</text>
<text x="1337.5" y="720" text-anchor="middle" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#102b52">Remove tmpfs filler file</text>
