<text x="265.0" y="716" text-anchor="middle" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#102b52">curl  &gt;  127.0.0.1:8080</text>
<text x="265.0" y="745" text-anchor="middle" font-family="Noto Sans,Arial,sans-serif" font-size="18" font-weight="400" fill="#102b52">No published host port</text>
